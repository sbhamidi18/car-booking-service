
spring.application.name=car-booking-service

# Local PostgreSQL configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/car_booking
spring.datasource.username=${DB_USERNAME:car_booking}
spring.datasource.password=${DB_PASSWORD:local_dev_password}

# Database schema is managed by Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway migrations
spring.flyway.enabled=true

# Credit-card validation service
credit-card.base-url=${CREDIT_CARD_BASE_URL:http://localhost:9090/host/credit-card-payment-api}
credit-card.connect-timeout=2s
credit-card.read-timeout=3s

# Local Kafka configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=car-booking-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
